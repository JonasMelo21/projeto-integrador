[project]
name = "projeto-integrador-iii-2-0"
version = "0.2.0"
description = "RentMaster — rental property intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
    "azure-storage-file-datalake>=12.14.0",
    "azure-identity>=1.15.0",
    "azure-storage-blob>=12.28.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "vanna>=0.7.0",
    "chromadb>=0.4.0",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
scraping = [
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.28.0",
    "beautifulsoup4>=4.14.3",
    "playwright>=1.58.0",
]

notebook = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipython>=8.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.0.0",
]
