[project]
name = "rentmaster-backend"
version = "0.1.0"
description = "FastAPI backend for RentMaster - local SQLite dev stack"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "pandas==2.1.3",
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
]
