services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentmaster-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/rental.db
    volumes:
      # Esse mapeamento único já resolve a persistência do código, do rental.db e do chroma_db!
      - ./backend:/app
    networks:
      - rentmaster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentmaster-frontend
    ports:
      - "5173:80"
    networks:
      - rentmaster-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # O scrapper pode ficar aqui, ativado via "profiles" como você já fez perfeitamente

volumes:
  rental_db_data:
  chroma_db_data:

networks:
  rentmaster-network:
    driver: bridge