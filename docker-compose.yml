services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentmaster-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    networks:
      - rentmaster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentmaster-frontend
    ports:
      - "5173:80"
    networks:
      - rentmaster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  scraper:
    build:
      context: ./scrapper
      dockerfile: Dockerfile
    container_name: rentmaster-scraper
    environment:
      # Python
      - PYTHONUNBUFFERED=1
      # Scraper config
      - NUM_PAGES=2
      - FORMAT=json
      - TIMEOUT_MS=45000
      # Azure credentials (from .env files)
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      # Storage
      - STORAGE_ACCOUNT_NAME=${STORAGE_ACCOUNT_NAME}
    volumes:
      - ./scrapper:/app
      - scraper_data:/app/data
    networks:
      - rentmaster-network
    restart: "no"
    profiles:
      - scraper
    healthcheck:
      test: ["CMD", "python", "-c", "print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 10s

volumes:
  backend_data:
    driver: local
  scraper_data:
    driver: local

networks:
  rentmaster-network:
    driver: bridge
