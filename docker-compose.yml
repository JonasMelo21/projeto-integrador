services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rentmaster-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/rental.db
    volumes:
      - .:/app
      - /app/.venv
    networks:
      - rentmaster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  rentmaster-network:
    driver: bridge